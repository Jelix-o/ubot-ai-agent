name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($package.version)) {
            throw "package.json is missing version"
          }
          "value=$($package.version)" >> $env:GITHUB_OUTPUT

      - name: Validate release metadata
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          if (-not (Test-Path -LiteralPath "RELEASE-v$version.md")) {
            throw "Release notes are missing for v$version"
          }

      - name: Install dependencies
        run: npm ci

      - name: Build release package
        run: npm run package:win

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: UBot V${{ steps.version.outputs.value }}
          body_path: RELEASE-v${{ steps.version.outputs.value }}.md
          prerelease: ${{ contains(steps.version.outputs.value, '-rc.') }}
          files: release/ubot-${{ steps.version.outputs.value }}-win.zip
