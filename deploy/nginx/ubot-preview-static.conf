# This include is intentionally release-managed alongside preview.9958.uk.
# It is installed by the deployer into the same Nginx configuration directory
# as the vhost so the two files can be rolled back together.

if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
}

autoindex off;
disable_symlinks on;

# Serve only an opaque random page directory. A normal page request receives
# the trusted platform shell; content.html is executed only inside its sandbox.
location ~ "^/p/([A-Za-z0-9_-]{43})/$" {
    # A file-valued alias in a trailing-slash location makes Nginx append its
    # directory index and produces index.htmlindex.html. Internally rewrite to
    # the explicit file route so the browser URL and security headers stay the
    # same while the alias below resolves exactly one filename.
    rewrite "^/p/([A-Za-z0-9_-]{43})/$" /p/$1/index.html last;
}

location ~ "^/p/([A-Za-z0-9_-]{43})/index\\.html$" {
    alias __UBOT_HTML_PREVIEW_ROOT__/pages/$1/index.html;
    default_type text/html;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; connect-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'none'; frame-src 'self'" always;
}

location ~ "^/p/([A-Za-z0-9_-]{43})/content\\.html$" {
    alias __UBOT_HTML_PREVIEW_ROOT__/pages/$1/content.html;
    default_type text/html;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'; object-src 'none'; connect-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; worker-src 'none'; frame-src 'none'; sandbox allow-scripts" always;
}

location / {
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 404;
}
