server {
    listen 80;
    listen [::]:80;
    server_name bot.9958.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bot.9958.uk;

    ssl_certificate /etc/letsencrypt/live/bot.9958.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.9958.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    # Never proxy source, state, secrets, package manifests, or dotfiles.
    location ~ ^/(?:\.env|\.git|data(?:/|$)|config(?:/|$)|skills(?:/|$)|src(?:/|$)|scripts(?:/|$)|deploy(?:/|$)|docs(?:/|$)|package(?:-lock)?\.json)$ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:6200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 90s;
    }
}
