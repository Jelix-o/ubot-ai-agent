# Cloudflare Flexible connects to the origin over plain HTTP even when the
# browser used HTTPS.  Trust that exception only when the TCP peer is a
# documented Cloudflare edge and its CF-Visitor header says HTTPS.  Direct
# HTTP callers cannot bypass this check by forging CF-Visitor because their
# peer address is not in this list.  Keep this at the http include level (as
# /etc/nginx/sites-enabled normally is), not inside a server block.
geo $realip_remote_addr $ubot_cloudflare_edge {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

map "$ubot_cloudflare_edge:$http_cf_visitor" $ubot_cloudflare_https {
    default 0;
    ~*^1:.*"scheme"\s*:\s*"https".*$ 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name bot.9958.uk;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    # A direct HTTP request, including one with a forged CF-Visitor header,
    # still redirects.  Only a verified Cloudflare Flexible HTTPS request can
    # reach the local admin proxy over its HTTP origin connection.
    if ($ubot_cloudflare_https = 0) {
        return 301 https://$host$request_uri;
    }

    # This path is reachable through Cloudflare Flexible too, so retain the
    # same source/state protection as the TLS virtual host below.
    location ~ ^/(?:\.env|\.git|data(?:/|$)|config(?:/|$)|skills(?:/|$)|src(?:/|$)|scripts(?:/|$)|deploy(?:/|$)|docs(?:/|$)|package(?:-lock)?\.json)$ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:6200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 90s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bot.9958.uk;

    ssl_certificate /etc/letsencrypt/live/bot.9958.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.9958.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    # Never proxy source, state, secrets, package manifests, or dotfiles.
    location ~ ^/(?:\.env|\.git|data(?:/|$)|config(?:/|$)|skills(?:/|$)|src(?:/|$)|scripts(?:/|$)|deploy(?:/|$)|docs(?:/|$)|package(?:-lock)?\.json)$ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:6200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 90s;
    }
}
