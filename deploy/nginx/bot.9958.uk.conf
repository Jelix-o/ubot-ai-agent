# This vhost is installed only by scripts/install-cloudflare-origin-hardening.sh.
# Its supporting files are generated atomically by
# scripts/update-cloudflare-origin-allowlist.sh:
#   /etc/nginx/conf.d/ubot-cloudflare-origin.conf    (http-level CIDR map)
#   /etc/nginx/ubot-cloudflare-realip.conf           (server-level real-IP)
# The CIDR map is intentionally isolated to UBot. It does not alter source-IP
# handling for the other sites hosted by this Nginx instance.

server {
    listen 80;
    listen [::]:80;
    server_name bot.9958.uk;

    include /etc/nginx/ubot-cloudflare-realip.conf;
    if ($ubot_cloudflare_origin_allowed = 0) {
        return 403;
    }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bot.9958.uk;

    ssl_certificate __UBOT_BOT_CERT_PATH__;
    ssl_certificate_key __UBOT_BOT_KEY_PATH__;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/ubot-cloudflare-realip.conf;
    if ($ubot_cloudflare_origin_allowed = 0) {
        return 403;
    }

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    # Never proxy source, state, secrets, package manifests, or dotfiles.
    location ~ ^/(?:\.env|\.git|data(?:/|$)|config(?:/|$)|skills(?:/|$)|src(?:/|$)|scripts(?:/|$)|deploy(?:/|$)|docs(?:/|$)|package(?:-lock)?\.json)$ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:6200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr is rewritten only after the connected peer matches the
        # generated Cloudflare CIDR list. The Node service separately refuses
        # arbitrary proxy headers from non-loopback peers.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 90s;
    }
}
