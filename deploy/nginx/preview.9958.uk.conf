# Generated HTML is deliberately served from a separate origin. Do not merge
# this vhost into bot.9958.uk: model-generated browser JavaScript must never
# share the authenticated administrator/API origin.
#
# This file is included at the Nginx `http` level by the normal sites-enabled
# layout. It is deliberately independent from bot.9958.uk. Do not add a
# proxy_pass, cookie, API, or shared include from the administrator origin.

server {
    listen 80;
    listen [::]:80;
    server_name preview.9958.uk;

    include /etc/nginx/ubot-cloudflare-realip.conf;
    if ($ubot_cloudflare_origin_allowed = 0) {
        return 403;
    }

    server_tokens off;
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location / {
        return 301 https://preview.9958.uk$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name preview.9958.uk;

    # A Cloudflare Origin certificate is preferred. A host-managed certificate
    # is also acceptable when the proxy is configured for strict TLS. Paths
    # are substituted by deploy-linux-release.sh and never enter a release.
    ssl_certificate __UBOT_PREVIEW_CERT_PATH__;
    ssl_certificate_key __UBOT_PREVIEW_KEY_PATH__;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/ubot-cloudflare-realip.conf;
    if ($ubot_cloudflare_origin_allowed = 0) {
        return 403;
    }

    server_tokens off;
    include /etc/nginx/ubot-preview-static.conf;
}
